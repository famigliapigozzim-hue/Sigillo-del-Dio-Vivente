<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1e3a8a">
<title>Nel Sigillo del Dio Vivente</title>
<link rel="apple-touch-icon" href="icon-192.png">
<style>
	/* =========================================================
	1. VARIABILI E TEMA BASE (CANTI / PREDEFINITO)
	========================================================= */
	:root {
		--primary-color: #2563eb;
		--primary-hover: #1d4ed8;
		--primary-light: #eff6ff;
		--primary-border: #bfdbfe;
		
		--badge-bg: #dbeafe;
		--badge-text: #1e40af;
		--header-bg: #1e40af;
		--header-text: #ffffff;
	
		--bg-color: #f8fafc;
		--card-bg: #ffffff;
		--card-border: #e2e8f0;
		--text-color: #1e293b;
		--text-muted: #64748b;
		
		--font-size-base: 1rem;
		--radius-sm: 6px;
		--radius-md: 10px;
		--radius-lg: 16px;
		--shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
		--shadow-md: 0 4px 12px rgba(0,0,0,0.1);
		--transition-fast: 0.2s ease;
	}
	
	/* =========================================================
	2. VARIABILI PER SEZIONE (COLORI TENUI)
	========================================================= */
	body[data-section="messaggi"] {
		--primary-color: #0284c7;
		--primary-hover: #0369a1;
		--primary-light: #f0f9ff;
		--primary-border: #bae6fd;
		--badge-bg: #e0f2fe;
		--badge-text: #0369a1;
		--header-bg: #0369a1;
	}
	
	body[data-section="preghiere"] {
		--primary-color: #7c3aed;
		--primary-hover: #6d28d9;
		--primary-light: #f5f3ff;
		--primary-border: #ddd6fe;
		--badge-bg: #ede9fe;
		--badge-text: #5b21b6;
		--header-bg: #5b21b6;
	}
	
	/* =========================================================
	3. MODALITÀ SCURA (DARK MODE)
	========================================================= */
	@media (prefers-color-scheme: dark) {
		:root {
			--bg-color: #0f172a;
			--card-bg: #1e293b;
			--card-border: #334155;
			--text-color: #f1f5f9;
			--text-muted: #94a3b8;
			--shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
			--shadow-md: 0 4px 12px rgba(0,0,0,0.4);

			--primary-color: #3b82f6;
			--primary-hover: #60a5fa;
			--primary-light: rgba(59, 130, 246, 0.12);
			--primary-border: #1d4ed8;
			--badge-bg: #1e3a8a;
			--badge-text: #93c5fd;
			--header-bg: #0f172a;
		}
	
		body[data-section="messaggi"] {
			--primary-color: #38bdf8;
			--primary-hover: #7dd3fc;
			--primary-light: rgba(56, 189, 248, 0.12);
			--primary-border: #0284c7;
			--badge-bg: #0c4a6e;
			--badge-text: #7dd3fc;
			--header-bg: #0f172a;
		}
	
		body[data-section="preghiere"] {
			--primary-color: #a78bfa;
			--primary-hover: #c4b5fd;
			--primary-light: rgba(167, 139, 250, 0.12);
			--primary-border: #6d28d9;
			--badge-bg: #4c1d95;
			--badge-text: #ddd6fe;
			--header-bg: #0f172a;
		}
	}
	
	/* =========================================================
	4. STILI GENERALI & RESET
	========================================================= */
	* {
		box-sizing: border-box;
		margin: 0;
		padding: 0;
		-webkit-tap-highlight-color: transparent;
	}
	
	body {
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		background-color: var(--bg-color);
		color: var(--text-color);
		font-size: var(--font-size-base);
		line-height: 1.5;
		transition: background-color var(--transition-fast), color var(--transition-fast);
	}
	
	/* =========================================================
	5. HEADER & NAVIGAZIONE
	========================================================= */
	header {
		position: sticky;
		top: 0;
		z-index: 100;
		background-color: var(--header-bg);
		color: var(--header-text);
		padding: 0.75rem 1rem;
		display: flex;
		align-items: center;
		justify-content: space-between;
		box-shadow: var(--shadow-sm);
		transition: background-color var(--transition-fast);
	}
	
	.header-container {
		width: 100%;
		display: flex;
		justify-content: space-between;
		align-items: center;
	}

	.section-picker {
		background: transparent;
		border: none;
		color: inherit;
		font-size: 1.1rem;
		font-weight: 700;
		cursor: pointer;
		display: flex;
		align-items: center;
		gap: 0.4rem;
	}

	.btn-icon {
		background: transparent;
		border: none;
		color: inherit;
		font-size: 1.25rem;
		cursor: pointer;
	}
	
	/* =========================================================
	6. FILTRI E BARRA DI RICERCA
	========================================================= */
	.search-container {
		padding: 0.75rem 1rem 0.25rem 1rem;
		display: flex;
		flex-direction: column;
		gap: 0.5rem;
	}

	.search-row {
		display: flex;
		gap: 0.5rem;
		align-items: center;
	}
	
	.search-input {
		width: 100%;
		padding: 0.6rem 0.9rem;
		border-radius: var(--radius-md);
		border: 1px solid var(--card-border);
		background: var(--card-bg);
		color: var(--text-color);
		font-size: 0.95rem;
		outline: none;
	}

	.btn-toggle-filters {
		background: var(--card-bg);
		border: 1px solid var(--card-border);
		color: var(--text-muted);
		padding: 0.55rem 0.75rem;
		border-radius: var(--radius-md);
		cursor: pointer;
		display: flex;
		align-items: center;
		justify-content: center;
		font-size: 1rem;
	}
	
	.btn-toggle-filters.active {
		background: var(--primary-light);
		color: var(--primary-color);
		border-color: var(--primary-border);
	}
	
	.advanced-filters-row {
		display: none;
		flex-wrap: wrap;
		gap: 0.5rem;
		padding-top: 0.5rem;
		border-top: 1px dashed var(--card-border);
	}
	
	.advanced-filters-row.open {
		display: flex;
	}
	
	.filter-select {
		flex: 1;
		min-width: 120px;
		padding: 0.45rem 0.6rem;
		border-radius: var(--radius-md);
		border: 1px solid var(--card-border);
		background: var(--card-bg);
		color: var(--text-color);
		font-size: 0.85rem;
		outline: none;
	}

	.scope-row {
		display: flex;
		gap: 0.5rem;
		padding: 0.5rem 1rem;
	}

	.scope-chip {
		flex: 1;
		padding: 0.4rem;
		border-radius: var(--radius-md);
		border: 1px solid var(--card-border);
		background: var(--card-bg);
		color: var(--text-muted);
		font-size: 0.85rem;
		cursor: pointer;
	}

	.scope-chip.active {
		background: var(--primary-light);
		color: var(--primary-color);
		border-color: var(--primary-border);
		font-weight: 600;
	}
	
	.filter-chips {
		display: flex;
		gap: 0.4rem;
		overflow-x: auto;
		padding: 0.2rem 1rem 0.5rem 1rem;
	}

	.filter-chip {
		padding: 0.35rem 0.75rem;
		border-radius: var(--radius-lg);
		background: var(--card-bg);
		border: 1px solid var(--card-border);
		color: var(--text-muted);
		font-size: 0.85rem;
		white-space: nowrap;
		cursor: pointer;
	}

	.filter-chip.active {
		background: var(--primary-color);
		color: #ffffff;
		border-color: var(--primary-color);
	}
	
	/* =========================================================
	7. LISTA ELEMENTI E SCHERMATE
	========================================================= */
	#items-list {
		padding: 0.5rem 1rem 2rem 1rem;
		display: flex;
		flex-direction: column;
		gap: 0.75rem;
		max-width: 800px;
		margin: 0 auto;
	}
	
	.item-card {
		background: var(--card-bg);
		border: 1px solid var(--card-border);
		border-radius: var(--radius-md);
		padding: 0.9rem 1rem;
		box-shadow: var(--shadow-sm);
		cursor: pointer;
		display: flex;
		justify-content: space-between;
		align-items: center;
		gap: 0.5rem;
	}

	.item-card-info { flex: 1; display: flex; flex-direction: column; gap: 0.2rem; }
	.item-card-meta { font-size: 0.8rem; color: var(--text-muted); }
	.item-card-title { font-size: 1.05rem; font-weight: 600; color: var(--text-color); }
	.item-card-snippet { font-size: 0.85rem; color: var(--text-muted); }
	.item-badge { display: inline-block; font-size: 0.75rem; color: var(--badge-text); font-weight: 600; margin-bottom: 0.2rem; }
	
	.no-results { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
	
	.view-section { display: none; }
	.view-section.active { display: block; }

	#detail-view { max-width: 800px; margin: 0 auto; padding: 1rem 1rem 5rem 1rem; }
	.detail-header { display: flex; justify-content: space-between; margin-bottom: 1rem; }
	.btn-back { padding: 0.4rem 0.8rem; border-radius: var(--radius-md); border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-color); cursor: pointer; }
	#detail-body { font-size: calc(1rem * var(--content-font-scale, 1)); line-height: 1.7; white-space: pre-wrap; word-break: break-word; margin-top: 1rem; }

	/* DROPDOWN & MODALE */
	.dropdown-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: none; z-index: 150; }
	.dropdown-overlay.active { display: block; }
	.dropdown-menu { position: absolute; top: 3.5rem; left: 1rem; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-md); box-shadow: var(--shadow-md); width: 220px; overflow: hidden; }
	.dropdown-item { padding: 0.75rem 1rem; display: flex; justify-content: space-between; cursor: pointer; border-bottom: 1px solid var(--card-border); }
	.dropdown-item.active { background: var(--primary-light); color: var(--primary-color); font-weight: 600; }

	.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 200; padding: 1rem; }
	.modal-overlay.active { display: flex; }
	.modal-content { background: var(--card-bg); border-radius: var(--radius-lg); width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
	.setting-item { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0; border-bottom: 1px solid var(--card-border); }
	.btn-setting { padding: 0.4rem 0.8rem; border-radius: var(--radius-sm); background: var(--primary-color); color: #fff; border: none; cursor: pointer; }
</style>
</head>
<body>

	<header>
		<div class="header-container">
			<button class="section-picker" id="section-picker-btn" onclick="toggleDropdown()">
				<span id="section-picker-label">📖 Canti</span><span class="chev">▾</span>
			</button>
			<div class="header-controls">
				<button class="btn-icon" id="btn-settings" onclick="openSettings()" aria-label="Impostazioni" title="Impostazioni">⚙️</button>
			</div>
		</div>
	</header>

	<div class="dropdown-overlay" id="dropdown-overlay" onclick="closeDropdown()">
		<div class="dropdown-menu" id="dropdown-menu" onclick="event.stopPropagation()"></div>
	</div>

	<main>
		<!-- INDICE -->
		<div id="list-view" class="view-section active">
			<div class="search-container">
				<div class="search-row">
					<input type="text" id="search-bar" class="search-input" placeholder="Cerca parola chiave nel testo..." oninput="applyFilters()">
					<button type="button" id="btn-toggle-filters" class="btn-toggle-filters" onclick="toggleAdvancedFilters()" title="Filtri Avanzati" style="display: none;">⚙️</button>
				</div>
				<div id="advanced-filters" class="advanced-filters-row">
					<select id="filter-mittente" class="filter-select" onchange="applyFilters()">
						<option value="all">Tutti i mittenti</option>
					</select>
					<select id="filter-destinatario" class="filter-select" onchange="applyFilters()">
						<option value="all">Tutti i destinatari</option>
					</select>
					<select id="filter-anno" class="filter-select" onchange="applyFilters()">
						<option value="all">Tutti gli anni</option>
					</select>
				</div>
			</div>
			
			<div class="scope-row" id="scope-row">
				<button class="scope-chip active" id="scope-sezione" onclick="setScope('sezione')">🔍 Questa sezione</button>
				<button class="scope-chip" id="scope-tutto" onclick="setScope('tutto')">🔍 Tutte le sezioni</button>
			</div>
			
			<div class="filter-chips" id="filter-chips"></div>
			<div id="items-list"></div>
		</div>

		<!-- DETTAGLIO -->
		<div id="detail-view" class="view-section">
			<div class="detail-header">
				<button class="btn-back" onclick="showListView()">← Indice</button>
				<div style="display:flex; gap:0.5rem;">
					<button class="btn-back" id="btn-prev" onclick="prevItem()">◀ Prec.</button>
					<button class="btn-back" id="btn-next" onclick="nextItem()">Succ. ▶</button>
				</div>
			</div>
			<div class="detail-meta">
				<div class="item-badge" id="detail-badge"></div>
				<h2 class="detail-title" id="detail-title"></h2>
				<div class="detail-subinfo" id="detail-subinfo"></div>
			</div>
			<div class="detail-actions" style="margin-top:0.5rem;">
				<button class="btn-back" id="btn-favorite-detail" onclick="toggleFavoriteCurrent()">☆ Preferito</button>
				<button class="btn-back" id="btn-share-detail" onclick="shareCurrent()">📤 Condividi</button>
			</div>
			<div id="detail-body"></div>
		</div>
	</main>

	<!-- IMPOSTAZIONI -->
	<div id="settings-modal" class="modal-overlay" onclick="closeSettingsOnOverlay(event)">
		<div class="modal-content" onclick="event.stopPropagation()">
			<div style="display:flex; justify-content:space-between; align-items:center;">
				<h3>Impostazioni</h3>
				<button class="btn-icon" style="color:var(--text-color);" onclick="closeSettings()">✕</button>
			</div>

			<div class="setting-item">
				<span>Dimensione testo</span>
				<div style="display:flex; align-items:center; gap:0.5rem;">
					<button class="btn-setting" onclick="changeFontSize(-1)">A-</button>
					<span id="font-size-value">100%</span>
					<button class="btn-setting" onclick="changeFontSize(1)">A+</button>
				</div>
			</div>

			<div class="setting-item">
				<span>Tema pagina</span>
				<button class="btn-setting" onclick="toggleTheme()">🌓 Cambia</button>
			</div>
		</div>
	</div>

<script>
	const SEZIONI = [
		{ id: 'canti', badge: '📖', label: '📖 Canti', file: 'canti.json', filtroField: 'categorie', filtroTipo: 'array',
		  titoloField: 'titolo', sottotitolo: (it) => '', searchFields: ['titolo', 'testo'] },
		{ id: 'messaggi', badge: '☁️', label: '☁️ Messaggi', file: 'messaggi.json', filtroField: 'chiParla', filtroTipo: 'stringa',
		  titoloField: 'chiParla', sottotitolo: (it) => (it.dataDisplay || it.data || '') + (it.destinatario ? ' — a ' + it.destinatario : '') + (it.luogo ? ' — ' + it.luogo : ''),
		  searchFields: ['chiParla', 'destinatario', 'luogo', 'dataDisplay', 'testo'] },
		{ id: 'preghiere', badge: '🙏', label: '🙏 Preghiere', file: 'preghiere.json', filtroField: 'categoria', filtroTipo: 'stringa',
		  titoloField: 'titolo', sottotitolo: (it) => it.categoria || '', searchFields: ['titolo', 'categoria', 'testo'] }
	];

	const DEFAULT_SETTINGS = { theme: 'light', fontSize: 1.05, vibrationEnabled: true };
	const BASE_FONT_SIZE = DEFAULT_SETTINGS.fontSize;

	function getSetting(key) {
		const raw = localStorage.getItem(key);
		if (raw === null) return DEFAULT_SETTINGS[key];
		if (typeof DEFAULT_SETTINGS[key] === 'boolean') return raw === 'true';
		if (typeof DEFAULT_SETTINGS[key] === 'number') return parseFloat(raw);
		return raw;
	}
	function setSetting(key, value) { localStorage.setItem(key, value); }

	let dataStore = {};
	let currentSectionId = 'canti';
	let currentView = 'sezione';
	let searchScope = 'sezione';
	let activeFilterBySection = {};
	let currentList = [];
	let currentDetailRef = null;
	let currentFontSize = getSetting('fontSize');

	// --- NORMALIZZAZIONE E FILTRI AVANZATI ---
	function normalizeText(str) {
		if (!str) return '';
		return str.toString()
			.toLowerCase()
			.normalize("NFD")
			.replace(/[\u0300-\u036f]/g, "")
			.trim();
	}

	function toggleAdvancedFilters() {
		vibrate();
		const panel = document.getElementById('advanced-filters');
		const btn = document.getElementById('btn-toggle-filters');
		if (!panel || !btn) return;

		const isOpen = panel.classList.toggle('open');
		btn.classList.toggle('active', isOpen);
	}

	function updateAdvancedFiltersVisibility() {
		const btn = document.getElementById('btn-toggle-filters');
		const panel = document.getElementById('advanced-filters');
		if (!btn) return;

		if (currentSectionId === 'messaggi' || searchScope === 'tutto') {
			btn.style.display = 'flex';
		} else {
			btn.style.display = 'none';
			if (panel) panel.classList.remove('open');
			if (btn) btn.classList.remove('active');
			resetAdvancedSelects();
		}
	}

	function resetAdvancedSelects() {
		['filter-mittente', 'filter-destinatario', 'filter-anno'].forEach(id => {
			const el = document.getElementById(id);
			if (el) el.value = 'all';
		});
	}

	function populateAdvancedFilters() {
		const messaggi = dataStore.messaggi || [];
		const mittenti = new Set();
		const destinatari = new Set();
		const anni = new Set();

		messaggi.forEach(m => {
			if (m.chiParla || m.mittente || m.autore) mittenti.add(m.chiParla || m.mittente || m.autore);
			if (m.destinatario || m.ricevutoDa) destinatari.add(m.destinatario || m.ricevutoDa);
			if (m.data || m.dataDisplay) {
				const str = (m.data || '') + ' ' + (m.dataDisplay || '');
				const matchAnno = str.match(/\b(19|20)\d{2}\b/);
				if (matchAnno) anni.add(matchAnno[0]);
			}
		});

		const selectMittente = document.getElementById('filter-mittente');
		if (selectMittente) {
			selectMittente.innerHTML = '<option value="all">Tutti i mittenti</option>' +
				Array.from(mittenti).sort().map(m => `<option value="${m}">${m}</option>`).join('');
		}

		const selectDestinatario = document.getElementById('filter-destinatario');
		if (selectDestinatario) {
			selectDestinatario.innerHTML = '<option value="all">Tutti i destinatari</option>' +
				Array.from(destinatari).sort().map(d => `<option value="${d}">${d}</option>`).join('');
		}

		const selectAnno = document.getElementById('filter-anno');
		if (selectAnno) {
			selectAnno.innerHTML = '<option value="all">Tutti gli anni</option>' +
				Array.from(anni).sort((a,b) => b - a).map(a => `<option value="${a}">${a}</option>`).join('');
		}
	}

	async function loadAll() {
		const container = document.getElementById('items-list');
		if (container) container.innerHTML = '<div class="no-results">Caricamento...</div>';
		
		try {
			const results = await Promise.allSettled(
				SEZIONI.map(s => fetch(s.file).then(r => r.json()))
			);
			
			results.forEach((result, i) => {
				const section = SEZIONI[i];
				if (result.status === "fulfilled") {
					const val = result.value;
					dataStore[section.id] = Array.isArray(val) ? val : (val[section.id] || []);
				} else {
					dataStore[section.id] = [];
				}
			});
		} catch (err) {
			if (container) container.innerHTML = '<div class="no-results">Errore caricamento dati.</div>';
			return;
		}

		populateAdvancedFilters();
		updateAdvancedFiltersVisibility();
		renderSectionPickerLabel();
		renderFilterChips();
		applyFilters();
		document.body.setAttribute('data-section', currentSectionId);
		applyFontSize();
	}

	function sezioneCfg(id) { return SEZIONI.find(s => s.id === id); }
	function itemTitolo(sezioneId, item) { const cfg = sezioneCfg(sezioneId); return item[cfg ? cfg.titoloField : 'titolo'] || ''; }

	function applyFilters() {
		if (currentView === 'preferiti-globali') { 
			renderPreferitiGlobali(); 
			return; 
		}

		const query = normalizeText(document.getElementById('search-bar')?.value.trim() || '');
		const selectedMittente = document.getElementById('filter-mittente')?.value || 'all';
		const selectedDestinatario = document.getElementById('filter-destinatario')?.value || 'all';
		const selectedAnno = document.getElementById('filter-anno')?.value || 'all';

		function matchesItem(item, sectionConfig) {
			if (selectedMittente !== 'all') {
				const itemMittente = normalizeText(item.chiParla || item.mittente || item.autore || '');
				if (itemMittente !== normalizeText(selectedMittente)) return false;
			}

			if (selectedDestinatario !== 'all') {
				const itemDestinatario = normalizeText(item.destinatario || item.ricevutoDa || '');
				if (itemDestinatario !== normalizeText(selectedDestinatario)) return false;
			}

			if (selectedAnno !== 'all') {
				const itemDateStr = (item.data || '') + ' ' + (item.dataDisplay || '');
				if (!itemDateStr.includes(selectedAnno)) return false;
			}

			if (query) {
				const extraFields = ['testo', 'corpo', 'chiParla', 'destinatario', 'autore'];
				const allSearchFields = Array.from(new Set([...(sectionConfig.searchFields || []), ...extraFields]));
				const hay = allSearchFields.map(f => normalizeText(item[f] || '')).join(' ');
				if (!hay.includes(query)) return false;
			}

			return true;
		}

		if (searchScope === 'tutto') {
			let results = []; 
			let resultSections = [];

			SEZIONI.forEach(s => {
				(dataStore[s.id] || []).forEach(it => {
					if (matchesItem(it, s)) {
						results.push(it);
						resultSections.push(s.id);
					}
				});
			});

			renderList(results, resultSections);
			return;
		}

		const currentSec = SEZIONI.find(s => s.id === currentSectionId) || { searchFields: [] };
		let currentItems = dataStore[currentSectionId] || [];

		// Filtro Categoria/Chip attivo
		const activeFilter = activeFilterBySection[currentSectionId] || null;
		if (activeFilter) {
			currentItems = currentItems.filter(it => 
				currentSec.filtroTipo === 'array' ? (it[currentSec.filtroField] || []).includes(activeFilter) : it[currentSec.filtroField] === activeFilter
			);
		}

		const filtered = currentItems.filter(it => matchesItem(it, currentSec));
		renderList(filtered, filtered.map(() => currentSectionId));
	}

	function renderList(items, sections) {
		const container = document.getElementById('items-list');
		container.innerHTML = '';
		if (!items || items.length === 0) { 
			container.innerHTML = '<div class="no-results">Nessun risultato trovato.</div>'; 
			return; 
		}
		
		currentList = items;
		const showBadge = searchScope === 'tutto' || currentView === 'preferiti-globali';

		items.forEach((item, idx) => {
			const sezione = sections ? sections[idx] : currentSectionId;
			const cfg = sezioneCfg(sezione);
			const card = document.createElement('div');
			card.className = 'item-card';
			card.onclick = () => { vibrate(); showDetail(sezione, idx, items, sections); };

			const info = document.createElement('div');
			info.className = 'item-card-info';
			
			if (showBadge && cfg) { 
				const b = document.createElement('div'); 
				b.className = 'item-badge'; 
				b.textContent = cfg.badge + ' ' + cfg.label.replace(/^\S+\s/, ''); 
				info.appendChild(b); 
			}

			const titleEl = document.createElement('div'); 
			titleEl.className = 'item-card-title'; 
			titleEl.textContent = itemTitolo(sezione, item);

			const metaEl = document.createElement('div'); 
			metaEl.className = 'item-card-meta'; 
			metaEl.textContent = cfg ? cfg.sottotitolo(item) : '';

			const snippetEl = document.createElement('div'); 
			snippetEl.className = 'item-card-snippet';
			snippetEl.textContent = (item.testo || item.corpo || '').replace(/\s+/g, ' ').slice(0, 100) + '...';

			info.appendChild(titleEl); 
			info.appendChild(metaEl); 
			info.appendChild(snippetEl);

			card.appendChild(info);
			container.appendChild(card);
		});
	}

	function showDetail(sezione, idx, list, sections) {
		if (!list || idx < 0 || idx >= list.length) return;
		
		const realSection = (sections && sections[idx]) ? sections[idx] : sezione;
		currentSectionId = realSection;
		currentList = list;
		currentDetailRef = { sezione: realSection, index: idx };

		const item = list[idx];
		if (!item) return;

		const cfg = sezioneCfg(realSection);
		document.getElementById('detail-title').textContent = itemTitolo(realSection, item);
		document.getElementById('detail-subinfo').textContent = cfg ? cfg.sottotitolo(item) : '';
		document.getElementById('detail-badge').textContent = cfg ? (cfg.badge + ' ' + cfg.label) : '';
		document.getElementById('detail-body').innerHTML = item.testo || item.corpo || '';

		document.getElementById('btn-prev').disabled = (idx <= 0);
		document.getElementById('btn-next').disabled = (idx >= list.length - 1);

		document.getElementById('list-view').style.display = 'none';
		const detailView = document.getElementById('detail-view');
		detailView.style.display = 'block';
		window.scrollTo({ top: 0, behavior: 'instant' });
	}

	function showListView() {
		vibrate();
		document.getElementById('detail-view').style.display = 'none';
		document.getElementById('list-view').style.display = 'block';
	}

	function switchSection(sezione) {
		if (!SEZIONI.some(s => s.id === sezione)) return;
		currentSectionId = sezione;
		currentView = 'sezione';

		document.body.setAttribute('data-section', sezione);
		document.getElementById('search-bar').value = '';
		resetAdvancedSelects();
		updateAdvancedFiltersVisibility();
		
		showListView();
		renderSectionPickerLabel();
		renderFilterChips();
		applyFilters();
	}

	function setScope(scope) {
		vibrate();
		searchScope = scope;
		document.getElementById('scope-sezione').classList.toggle('active', scope === 'sezione');
		document.getElementById('scope-tutto').classList.toggle('active', scope === 'tutto');
		document.getElementById('filter-chips').style.display = scope === 'tutto' ? 'none' : 'flex';
		updateAdvancedFiltersVisibility();
		applyFilters();
	}

	function renderFilterChips() {
		const container = document.getElementById('filter-chips');
		if (!container || currentView !== 'sezione') return;
		container.innerHTML = '';
		
		const cfg = sezioneCfg(currentSectionId);
		const items = dataStore[currentSectionId] || [];
		const activeFilter = activeFilterBySection[currentSectionId] || null;

		const allChip = document.createElement('button');
		allChip.className = 'filter-chip' + (!activeFilter ? ' active' : '');
		allChip.textContent = 'Tutti';
		allChip.onclick = () => { vibrate(); activeFilterBySection[currentSectionId] = null; renderFilterChips(); applyFilters(); };
		container.appendChild(allChip);

		let values = new Set();
		items.forEach(it => {
			const v = it[cfg.filtroField];
			if (cfg.filtroTipo === 'array') (v || []).forEach(x => values.add(x));
			else if (v) values.add(v);
		});

		Array.from(values).sort().forEach(val => {
			const chip = document.createElement('button');
			chip.className = 'filter-chip' + (activeFilter === val ? ' active' : '');
			chip.textContent = val;
			chip.onclick = () => { vibrate(); activeFilterBySection[currentSectionId] = (activeFilter === val) ? null : val; renderFilterChips(); applyFilters(); };
			container.appendChild(chip);
		});
	}

	function prevItem() { vibrate(); if (currentDetailRef && currentDetailRef.index > 0) showDetail(currentDetailRef.sezione, currentDetailRef.index - 1, currentList); }
	function nextItem() { vibrate(); if (currentDetailRef && currentDetailRef.index < currentList.length - 1) showDetail(currentDetailRef.sezione, currentDetailRef.index + 1, currentList); }

	function renderDropdown() {
		const menu = document.getElementById('dropdown-menu');
		menu.innerHTML = '';
		SEZIONI.forEach(s => {
			const el = document.createElement('div');
			el.className = 'dropdown-item' + (currentSectionId === s.id ? ' active' : '');
			el.innerHTML = `<span>${s.label}</span><span class="count">${(dataStore[s.id] || []).length}</span>`;
			el.onclick = () => { vibrate(); switchSection(s.id); closeDropdown(); };
			menu.appendChild(el);
		});
	}

	function toggleDropdown() { vibrate(); renderDropdown(); document.getElementById('dropdown-overlay').classList.toggle('active'); }
	function closeDropdown() { document.getElementById('dropdown-overlay').classList.remove('active'); }
	function renderSectionPickerLabel() { document.getElementById('section-picker-label').textContent = sezioneCfg(currentSectionId)?.label || ''; }

	function openSettings() { vibrate(); document.getElementById('settings-modal').classList.add('active'); }
	function closeSettings() { vibrate(); document.getElementById('settings-modal').classList.remove('active'); }
	function closeSettingsOnOverlay(e) { if (e.target.id === 'settings-modal') closeSettings(); }

	function changeFontSize(dir) { vibrate(); currentFontSize += dir * 0.1; applyFontSize(); }
	function applyFontSize() { 
		document.documentElement.style.setProperty('--content-font-scale', currentFontSize / BASE_FONT_SIZE); 
		document.getElementById('font-size-value').textContent = Math.round((currentFontSize/BASE_FONT_SIZE)*100) + '%';
	}
	function toggleTheme() { vibrate(); const cur = document.documentElement.getAttribute('data-theme'); document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark'); }
	function vibrate() { if ('vibrate' in navigator) try { navigator.vibrate(15); } catch(e){} }

	document.addEventListener('DOMContentLoaded', () => {
		loadAll();
	});
</script>
</body>
</html>
